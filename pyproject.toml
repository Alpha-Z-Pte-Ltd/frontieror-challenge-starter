[project]
name = "frontieror-starter"
version = "0.1.0"
description = "Starting point for the FrontierOR Challenge: an LLM agent that writes solvers, and the toolkit that tests and submits them"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "frontieror",
    "openrouter>=1.3.4",
]

[tool.uv.sources]
frontieror = { workspace = true }

[tool.uv.workspace]
members = ["toolkit"]

[build-system]
requires = ["uv_build>=0.9.25,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]

# Your agent is the flat `agent/` package next to this file.
[tool.uv.build-backend]
module-name = "agent"
module-root = ""

[tool.ruff]
line-length = 120
target-version = "py314"
src = [".", "toolkit/src", "toolkit/tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["agent", "frontieror"]
