[project]
name = "frontieror"
version = "0.1.0"
description = "FrontierOR Challenge toolkit: downloads the problems, tests solvers the way the sandbox runs them, and submits"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "python-dotenv>=1.2.3",
    "typer>=0.27.2",
]

[project.scripts]
frontieror = "frontieror.cli:app"

[dependency-groups]
dev = ["pytest>=9.1.1"]

[build-system]
requires = ["uv_build>=0.9.25,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
